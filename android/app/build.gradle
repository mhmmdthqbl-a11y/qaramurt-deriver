apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Remove this line completely (no Google Services / Firebase needed for now)
// apply plugin: 'com.google.gms.google-services'

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.qaramurttaxi.driver"

    defaultConfig {
        applicationId "com.qaramurttaxi.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.0.0"
        multiDexEnabled true
        missingDimensionStrategy 'react-native', 'hermes'

        // Fix for $ in identifier warning in codegen (safe-area-context, etc.)
        externalNativeBuild {
            cmake {
                cppFlags "-Wno-error=dollar-in-identifier-extension -Wno-dollar-in-identifier-extension"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('qaramurt.keystore')
            storePassword System.getenv("STORE_PASSWORD") ?: "qaramurt123" // fallback for local
            keyAlias "qaramurt"
            keyPassword System.getenv("KEY_PASSWORD") ?: "qaramurt123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            shrinkResources true
            crunchPngs false
            zipAlignEnabled true
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfbjni.so'
        pickFirst '**/libreactnativejni.so'
        pickFirst '**/libhermes.so'
        pickFirst '**/libjsc.so'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Removed Firebase completely (no ads, no google-services.json needed)
    // implementation platform('com.google.firebase:firebase-bom:31.2.1')
    // implementation 'com.google.firebase:firebase-analytics-ktx'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
